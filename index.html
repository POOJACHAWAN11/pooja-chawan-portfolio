<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pooja Chawan | MERN Stack Developer & Playwright Automation Test Engineer</title>
    <meta name="description" content="Portfolio of Pooja Chawan: Senior MERN stack developer and Playwright automation test engineer, specialising in React.js, TypeScript, and robust product engineering." />
    <meta name="theme-color" content="#174d3b" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Smooth scrolling and base resets */
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 84px;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f7f9f6;
        color: #15231e;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: #c9ed75;
        color: #174d3b;
      }
      /* Ensure comfortable reading & no flickering transitions */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
